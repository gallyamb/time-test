name: Publish release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.1.1'
        required: true

permissions:
  contents: read

concurrency:
  group: central-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v3
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bash .github/scripts/verify-release-tag.sh
      - name: Build and test without publishing credentials
        run: |
          python3 verification/test_release_tag.py
          ./gradlew clean build -PreleaseVersion="$RELEASE_VERSION" --no-daemon
      - name: Publish all modules and platform through Central Portal
        run: |
          if [[ -n "$SIGNING_KEYID" ]]; then
            export ORG_GRADLE_PROJECT_signingInMemoryKeyId="$SIGNING_KEYID"
          fi
          ./gradlew publishAndReleaseToMavenCentral -Prelease=true -PreleaseVersion="$RELEASE_VERSION" --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY_CONTENT }}
          SIGNING_KEYID: ${{ secrets.SIGNING_KEYID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
